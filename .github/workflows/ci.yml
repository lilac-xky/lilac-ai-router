name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 安装 SDK 到本地仓库
        run: mvn -B -f lilac-ai-router-sdk/pom.xml install -DskipTests

      - name: 打包backend
        run: mvn -B -f backend/pom.xml package -DskipTests

      - name: 构建 Docker 镜像
        run: docker build -t lilac-ai-router:ci .
