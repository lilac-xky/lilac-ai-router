spring:
  application:
    name: lilac-ai-router
  profiles:
    # 默认 dev；容器里用 SPRING_PROFILES_ACTIVE=prod 覆盖激活 application-prod.yml。
    # 写成占位符而不是硬编码 dev，是为了让环境变量能明确压过配置文件（否则 profile
    # 到底取哪个会随属性源顺序变，是排查时很坑的一类问题）。
    active: ${SPRING_PROFILES_ACTIVE:dev}
  ai:
    openai:
      # 通义千问兼容 OpenAI 接口
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true        # 没历史表时自动打基线（防止以后 CI/新机器首启动崩溃）
    baseline-version: 1000           # 和V1000 对齐
    validate-on-migrate: true        # 严格校验（防止 V1 改了之后又跑老环境）
    out-of-order: false              # 不允许乱序（生产习惯；以后要撤销迁移再开）

server:
  port: 9090
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true